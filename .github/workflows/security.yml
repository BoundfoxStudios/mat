name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A dependency that is clean today can carry an advisory tomorrow without anything changing here.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  cve-scan:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Scan
        # Exact version: `bunx` would otherwise pull whatever the registry serves as latest at run
        # time, so the scanner itself would be unreviewed code executing with the checkout present.
        run: bunx cve-lite-cli@1.28.0 . --fail-on high
